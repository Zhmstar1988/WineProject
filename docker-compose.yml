# ============================================================
# 智能分酒系统 - Docker Compose 编排
# 包含：MySQL 8.0 + Redis 7 + Spring Boot 应用
# 用法：docker-compose up -d
# ============================================================
version: '3.8'

services:
  # ---- MySQL 数据库 ----
  mysql:
    image: mysql:8.0
    container_name: wine-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-winedb}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      TZ: Asia/Singapore
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./wine-backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./wine-backend/src/main/resources/db/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - wine-net

  # ---- Redis 缓存/分布式锁 ----
  redis:
    image: redis:7-alpine
    container_name: wine-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - wine-net

  # ---- Spring Boot 应用 ----
  app:
    build:
      context: ./wine-backend
      dockerfile: Dockerfile
    container_name: wine-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SQL_INIT_MODE: never
      THYMELEAF_CACHE: "true"
      # MySQL 连接（使用容器名作为主机名）
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-winedb}
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      # Redis 连接
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      # JWT 密钥
      JWT_SECRET: ${JWT_SECRET:-WineSingaporeDevSecretKeyForJWTTokenGenerationMustBeLong}
      # 通联支付密钥（生产环境通过环境变量注入）
      ALLINPAY_PRIVATE_KEY: ${ALLINPAY_PRIVATE_KEY:-placeholder_private_key}
      ALLINPAY_PUBLIC_KEY: ${ALLINPAY_PUBLIC_KEY:-placeholder_public_key}
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - wine-net

volumes:
  mysql-data:
  redis-data:

networks:
  wine-net:
    driver: bridge
