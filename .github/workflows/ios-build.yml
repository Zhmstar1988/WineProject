name: iOS Build

on:
  push:
    paths:
      - 'wine-ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:
    inputs:
      build_config:
        description: 'Build configuration'
        type: choice
        options: [Debug, Release]
        default: Debug

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Select Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.3.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate Xcode project
        working-directory: wine-ios
        run: xcodegen generate

      - name: Build for iOS Simulator
        working-directory: wine-ios
        run: |
          set -o pipefail
          xcodebuild             -project WineDispenser.xcodeproj             -scheme WineDispenser             -sdk iphonesimulator             -destination 'generic/platform=iOS Simulator'             -configuration ${{ github.event.inputs.build_config || 'Debug' }}             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             build 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: wine-ios/build.log
          retention-days: 14
