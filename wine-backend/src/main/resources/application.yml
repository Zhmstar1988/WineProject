server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  tomcat:
    threads:
      max: 400
      min-spare: 50
    max-connections: 10000
    accept-count: 200

spring:
  application:
    name: wine-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # MySQL 数据库（支持 Docker 环境变量注入）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:winedb}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Singapore&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      pool-name: WineHikariPool
      maximum-pool-size: 200
      minimum-idle: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
      continue-on-error: true
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql

  # Redis 配置（分布式锁/缓存/在机容量互斥）
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 100
          max-idle: 50
          min-idle: 5
          max-wait: 3000ms

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Singapore

  # Thymeleaf 模板配置（管理后台）
  thymeleaf:
    prefix: classpath:/templates/admin/
    suffix: .html
    mode: HTML
    cache: ${THYMELEAF_CACHE:false}

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.wine.domain
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  secret: ${JWT_SECRET:WineSingaporeDevSecretKeyForJWTTokenGenerationMustBeLong}
  expiration: 604800000   # 7天
  header: Authorization
  prefix: "Bearer "

# 通联国际 CNP 配置（环境差异化配置见 application-dev.yml / application-prod.yml）
# 切换方式：SPRING_PROFILES_ACTIVE=dev (测试) 或 prod (生产)
# 敏感信息（mcht-id/private-key/public-key）统一由环境变量 ALLINPAY_INTL_* 注入

# Twilio 国际短信与验证码（新加坡市场）
# 两种验证码模式：
#   Verify API（推荐生产）: 配置 verify-service-sid，Twilio 生成并下发验证码，
#                          自动使用合规发送者 ID（如 TWVerify），无需自购号码、无需本地存验证码
#   普通短信模式: 不配置 verify-service-sid，本地生成验证码 + sendSms 发送
twilio:
  # 开发阶段设为 false 使用 mock 模式（验证码入库，不真实发送）
  enabled: ${TWILIO_ENABLED:true}
  # Account SID（以 AC 开头）
  account-sid: ${TWILIO_ACCOUNT_SID:}
  # API Key SID（以 SK 开头，可选）
  api-key-sid: ${TWILIO_API_KEY_SID:}
  # API Key Secret
  api-key-secret: ${TWILIO_API_KEY_SECRET:}
  # Auth Token（与 API Key 二选一）
  auth-token: ${TWILIO_AUTH_TOKEN:}
  # 普通短信发信号码（Verify 模式下不需要）
  from-number: ${TWILIO_FROM_NUMBER:+15005550006}
  # 短信签名前缀（新加坡合规：避免酒类字样，使用中性名称）
  prefix: "[SGVerify]"
  # Verify Service SID（VA 开头）。配置后启用 Verify API；留空使用普通短信模式
  # 创建：Twilio 控制台 -> Explore Products -> Verify -> Services -> Create new
  verify-service-sid: ${TWILIO_VERIFY_SERVICE_SID:}

# 分酒机 IoT 配置
dispenser:
  base-url: http://dispenser.local
  sla:
    command-timeout-ms: 3000
    dispense-timeout-ms: 30000
    network-tolerance-ms: 45000

# 业务配置
wine:
  order:
    pay-timeout-minutes: 15
  age:
    legal-age: 18
  lock:
    in-machine-prefix: "wine:lock:slot:"
    user-lock-prefix: "wine:lock:user:"
  # 连接池告警阈值（由 MetricsAlertService 定时检查并输出 warn 日志）
  # 实际告警建议在 Prometheus AlertManager 中配置，此处提供应用内兜底
  alert:
    enabled: true
    check-interval-ms: 30000
    hikari-active-ratio-warn: 0.80    # 活跃连接占比 >= 80% 告警
    hikari-pending-threshold: 10      # 等待连接的线程数 >= 10 告警
    redis-active-ratio-warn: 0.80     # Redis 活跃连接占比 >= 80% 告警

logging:
  level:
    com.wine: ${LOG_LEVEL:warn}
    org.springframework.security: warn
    org.springframework: warn
    com.zaxxer.hikari: warn

# ============================================================
# Actuator + Micrometer 监控配置
# Prometheus 指标端点: GET /api/actuator/prometheus
# 健康检查端点:      GET /api/actuator/health
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      # 启用 HikariCP 连接池健康检查
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true
        step: 10s
