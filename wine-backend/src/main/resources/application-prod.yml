# ============================================================
# 生产环境配置 (SPRING_PROFILES_ACTIVE=prod)
# 通联国际生产网关（新加坡市场）
# ============================================================

# 通联国际 CNP - 生产环境（新加坡市场）
allinpay-intl:
  # 通联国际生产网关（正式上线前向通联国际确认地址）
  base-url: ${ALLINPAY_INTL_BASE_URL:MUST_SET_ALLINPAY_INTL_BASE_URL}
  # 接入号（8位数字，通联国际分配）
  inst-no: ${ALLINPAY_INTL_INST_NO:}
  # 商户号（15位，通联国际分配，必填）
  mcht-id: ${ALLINPAY_INTL_MCHT_ID:MUST_SET_ALLINPAY_INTL_MCHT_ID}
  # 接口版本固定 V2.0.0
  version: V2.0.0
  # 交易币种：新加坡元
  currency: SGD
  # 交易类型（具体取值以通联附录A为准）
  trans-type-purchase: ${ALLINPAY_INTL_TRANS_TYPE_PURCHASE:Purchase}
  trans-type-query: ${ALLINPAY_INTL_TRANS_TYPE_QUERY:Query}
  trans-type-refund: ${ALLINPAY_INTL_TRANS_TYPE_REFUND:Refund}
  # 商户私钥 / 通联公钥，必须通过环境变量注入，不可硬编码
  private-key: ${ALLINPAY_INTL_PRIVATE_KEY:MUST_SET_ALLINPAY_INTL_PRIVATE_KEY}
  public-key: ${ALLINPAY_INTL_PUBLIC_KEY:MUST_SET_ALLINPAY_INTL_PUBLIC_KEY}
  # 生产环境回调地址（必须公网可达 HTTPS）
  notify-url: ${ALLINPAY_INTL_NOTIFY_URL:https://api.wine.sg/api/payment/notify}
  return-url: ${ALLINPAY_INTL_RETURN_URL:https://app.wine.sg/payment/result}
  # 收银台风格：TINY（仅卡信息）/ DEFAULT
  pay-page-style: TINY
  # 生产环境关闭 mock
  mock: false

# 生产环境日志级别
logging:
  level:
    com.wine: info
    org.springframework.security: warn
