<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: headContent(${pageTitle})}"></head>
<body>
<div th:replace="~{layout :: body(${role}, ${roleName}, ${pageTitle})}"></div>

<div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0" th:text="${role == 5} ? '分酒机设备管理' : '分酒机监控'">设备管理</h4>
        <button class="btn btn-danger" th:if="${role == 5}" onclick="openEdit()"><i class="bi bi-plus"></i> 新增设备</button>
    </div>
    <div class="card stat-card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead><tr>
                    <th>设备名称</th><th>设备编号</th><th>MAC</th><th>所属酒吧</th>
                    <th>瓶位数</th><th>状态</th><th>最后心跳</th><th>固件</th><th>操作</th>
                </tr></thead>
                <tbody id="tbody"><tr><td colspan="9" class="text-center text-muted">加载中...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="modalTitle">新增设备</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
            <input type="hidden" id="f-id">
            <div class="mb-3"><label class="form-label">设备名称</label><input class="form-control" id="f-deviceName"></div>
            <div class="mb-3"><label class="form-label">设备编号</label><input class="form-control" id="f-deviceNo"></div>
            <div class="mb-3"><label class="form-label">MAC地址</label><input class="form-control" id="f-mac"></div>
            <div class="row">
                <div class="col"><label class="form-label">所属酒吧ID</label><input class="form-control" id="f-barId" type="number"></div>
                <div class="col"><label class="form-label">瓶位数</label><input class="form-control" id="f-slotCount" type="number" value="8"></div>
            </div>
            <div class="mt-3"><label class="form-label">状态</label>
                <select class="form-select" id="f-status"><option value="1">在线</option><option value="0">离线</option><option value="2">故障</option></select></div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
            <button class="btn btn-danger" onclick="save()">保存</button>
        </div>
    </div></div>
</div>

<script th:replace="~{layout :: scripts}"></script>
<script>
const dispStatusMap = {0:{text:'离线',cls:'secondary'},1:{text:'在线',cls:'success'},2:{text:'故障',cls:'danger'}};

async function load() {
    const res = await apiGet('/admin/dispensers');
    const list = res.data || [];
    document.getElementById('tbody').innerHTML = list.length ? list.map(d=>`
        <tr>
            <td>${d.deviceName}</td><td><code>${d.deviceNo}</code></td><td>${d.mac||''}</td>
            <td>酒吧#${d.barId}</td><td>${d.slotCount}</td>
            <td>${statusTag(d.status, dispStatusMap)}</td>
            <td>${d.lastHeartbeat||'-'}</td><td>${d.firmwareVersion||'-'}</td>
            <td>
                <a class="btn btn-sm btn-outline-primary" href="/api/admin/page/slots/${d.id}">瓶位</a>
                <button class="btn btn-sm btn-outline-secondary" onclick='openEdit(${JSON.stringify(d)})'>编辑</button>
            </td>
        </tr>`).join('') : '<tr><td colspan="9" class="text-center text-muted">暂无设备</td></tr>';
}

function openEdit(d) {
    d = d || {};
    document.getElementById('modalTitle').textContent = d.id ? '编辑设备' : '新增设备';
    document.getElementById('f-id').value = d.id || '';
    document.getElementById('f-deviceName').value = d.deviceName || '';
    document.getElementById('f-deviceNo').value = d.deviceNo || '';
    document.getElementById('f-mac').value = d.mac || '';
    document.getElementById('f-barId').value = d.barId || '';
    document.getElementById('f-slotCount').value = d.slotCount || 8;
    document.getElementById('f-status').value = d.status ?? 1;
    new bootstrap.Modal(document.getElementById('editModal')).show();
}

async function save() {
    const body = {
        id: document.getElementById('f-id').value || null,
        deviceName: document.getElementById('f-deviceName').value,
        deviceNo: document.getElementById('f-deviceNo').value,
        mac: document.getElementById('f-mac').value,
        barId: parseInt(document.getElementById('f-barId').value),
        slotCount: parseInt(document.getElementById('f-slotCount').value),
        status: parseInt(document.getElementById('f-status').value)
    };
    const res = body.id ? await apiPut('/admin/dispensers/'+body.id, body) : await apiPost('/admin/dispensers', body);
    if (res.code === 200) { bootstrap.Modal.getInstance(document.getElementById('editModal')).hide(); load(); }
    else alert(res.message);
}
load();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
