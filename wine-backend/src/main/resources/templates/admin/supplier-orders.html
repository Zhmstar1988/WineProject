<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: headContent(${pageTitle})}"></head>
<body>
<div th:replace="~{layout :: body(${role}, ${roleName}, ${pageTitle})}"></div>

<div class="main-content">
    <h4 class="mb-3">供酒记录</h4>
    <div class="alert alert-info"><i class="bi bi-info-circle"></i> 以下为您供应的酒款在各酒吧的销售记录</div>
    <div class="card stat-card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead><tr>
                    <th>订单号</th><th>酒吧</th><th>分酒机</th><th>酒款SKU</th>
                    <th>杯量</th><th>金额</th><th>订单状态</th><th>时间</th>
                </tr></thead>
                <tbody id="tbody"><tr><td colspan="8" class="text-center text-muted">加载中...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<script th:replace="~{layout :: scripts}"></script>
<script>
const orderStatusMap = {1:{text:'待支付',cls:'secondary'},2:{text:'支付中',cls:'warning'},3:{text:'已付款',cls:'info'},4:{text:'已完成',cls:'success'},5:{text:'已退款',cls:'danger'}};

async function load() {
    // 供酒商通过自己的 supplierId 查询关联酒款的订单
    const res = await apiGet('/admin/supplier-orders');
    const list = res.data || [];
    document.getElementById('tbody').innerHTML = list.length ? list.map(o=>`
        <tr>
            <td><code>${o.orderNo}</code></td><td>酒吧#${o.barId}</td><td>#${o.dispenserId}</td>
            <td>SKU#${o.wineSkuId}</td><td>${o.volumeMl}ml</td><td>${fmtMoney(o.paidAmount)}</td>
            <td>${statusTag(o.status, orderStatusMap)}</td><td>${o.createTime||''}</td>
        </tr>`).join('') : '<tr><td colspan="8" class="text-center text-muted">暂无供酒销售记录</td></tr>';
}
load();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
