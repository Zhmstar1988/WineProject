<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: headContent(${pageTitle})}"></head>
<body>
<div th:replace="~{layout :: body(${role}, ${roleName}, ${pageTitle})}"></div>

<div class="main-content">
    <h4 class="mb-3">设备物理损耗审计</h4>
    <div class="card stat-card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead><tr>
                    <th>订单号</th><th>分酒机</th><th>瓶位</th><th>损耗类型</th>
                    <th>目标量(ml)</th><th>实际量(ml)</th><th>损耗量(ml)</th><th>说明</th><th>时间</th>
                </tr></thead>
                <tbody id="tbody"><tr><td colspan="9" class="text-center text-muted">加载中...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<script th:replace="~{layout :: scripts}"></script>
<script>
const lossTypeMap = {1:{text:'出酒不足差额',cls:'danger'},2:{text:'换瓶残留',cls:'warning'}};

async function load() {
    const res = await apiGet('/admin/loss-audit');
    const list = res.data || [];
    document.getElementById('tbody').innerHTML = list.length ? list.map(l=>`
        <tr>
            <td>${l.orderNo||'-'}</td><td>#${l.dispenserId}</td><td>${l.slotNo}号</td>
            <td>${statusTag(l.lossType, lossTypeMap)}</td>
            <td>${l.targetMl||0}</td><td>${l.actualMl||0}</td>
            <td class="text-danger fw-bold">${l.lossMl||0}</td>
            <td><small>${l.remark||''}</small></td><td>${l.createTime||''}</td>
        </tr>`).join('') : '<tr><td colspan="9" class="text-center text-muted">暂无损耗记录</td></tr>';
}
load();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
