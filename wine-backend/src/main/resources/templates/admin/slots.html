<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: headContent(${pageTitle})}"></head>
<body>
<div th:replace="~{layout :: body(${role}, ${roleName}, ${pageTitle})}"></div>

<div class="main-content">
    <h4 class="mb-3">瓶位余量监控</h4>
    <div class="mb-3">
        <label class="form-label">选择分酒机</label>
        <select class="form-select" id="dispenserSelect" onchange="loadSlots()" style="max-width:300px">
            <option value="">请选择</option>
        </select>
    </div>
    <div class="row g-3" id="slotGrid"></div>
</div>

<script th:replace="~{layout :: scripts}"></script>
<script>
async function loadDispensers() {
    const res = await apiGet('/admin/dispensers');
    const sel = document.getElementById('dispenserSelect');
    (res.data||[]).forEach(d => {
        const opt = document.createElement('option');
        opt.value = d.id; opt.textContent = d.deviceName + ' (' + d.deviceNo + ')';
        sel.appendChild(opt);
    });
}

async function loadSlots() {
    const id = document.getElementById('dispenserSelect').value;
    const grid = document.getElementById('slotGrid');
    if (!id) { grid.innerHTML = ''; return; }
    const res = await apiGet('/admin/slots/' + id);
    const list = res.data || [];
    grid.innerHTML = list.length ? list.map(s => {
        const pct = s.initialCapacity ? Math.round(s.currentCapacity / s.initialCapacity * 100) : 0;
        const color = pct < 20 ? 'danger' : pct < 50 ? 'warning' : 'success';
        return `<div class="col-md-4 col-lg-3"><div class="card stat-card p-3">
            <div class="d-flex justify-content-between"><h5>${s.slotNo}号瓶位</h5>${s.needCalibration?'<span class="badge bg-danger">需校准</span>':''}</div>
            <div class="text-muted small mb-2">酒款SKU: ${s.wineSkuId||'-'} | 批次: ${s.batchNo||'-'}</div>
            <div class="mb-2"><span class="fw-bold">${s.currentCapacity||0}ml</span> / ${s.initialCapacity||0}ml</div>
            <div class="progress" style="height:8px"><div class="progress-bar bg-${color}" style="width:${pct}%"></div></div>
            <div class="mt-2 text-muted small">残留: ${s.residualMl||0}ml</div>
        </div></div>`;
    }).join('') : '<div class="col-12 text-center text-muted">该设备暂无瓶位数据</div>';
}

loadDispensers();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
