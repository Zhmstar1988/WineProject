<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台登录 - 新加坡智能分酒系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; display: flex; align-items: center; }
        .login-card { background: rgba(255,255,255,0.95); border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .wine-icon { font-size: 3rem; color: #8B0000; }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="login-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="wine-icon">🍷</div>
                    <h3 class="mt-2">智能分酒管理后台</h3>
                    <p class="text-muted">Singapore Wine Dispenser Admin</p>
                </div>
                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label">手机号</label>
                        <input type="text" class="form-control" id="phone" value="+6590000000" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">验证码</label>
                        <div class="input-group">
                            <input type="text" class="form-control" id="code" required>
                            <button class="btn btn-outline-secondary" type="button" id="sendCodeBtn">发送验证码</button>
                        </div>
                    </div>
                    <div class="alert alert-danger d-none" id="errorMsg"></div>
                    <button type="submit" class="btn btn-danger w-100 btn-lg">登 录</button>
                </form>
                <p class="text-center text-muted small mt-3">平台管理员 / 酒吧管理员登录</p>
            </div>
        </div>
    </div>
</div>

<script>
const API = '/api';
document.getElementById('sendCodeBtn').onclick = async function() {
    const phone = document.getElementById('phone').value;
    this.disabled = true; this.textContent = '发送中...';
    try {
        await fetch(API + '/auth/sms/send', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({phone})
        });
        let s = 60;
        const t = setInterval(() => {
            this.textContent = s + 's后重发';
            if (--s < 0) { clearInterval(t); this.disabled = false; this.textContent = '发送验证码'; }
        }, 1000);
    } catch(e) { alert('发送失败: ' + e.message); this.disabled = false; this.textContent = '发送验证码'; }
};

document.getElementById('loginForm').onsubmit = async function(e) {
    e.preventDefault();
    const err = document.getElementById('errorMsg');
    err.classList.add('d-none');
    try {
        const res = await fetch(API + '/auth/login', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({phone: document.getElementById('phone').value, code: document.getElementById('code').value, loginType: 1})
        });
        const data = await res.json();
        if (data.code === 200) {
            localStorage.setItem('token', data.data.token);
            localStorage.setItem('userId', data.data.userId);
            localStorage.setItem('role', data.data.role);
            localStorage.setItem('nickname', data.data.nickname);
            document.cookie = 'token=' + data.data.token + '; path=/api; SameSite=Lax';
            window.location.href = API + '/admin/page/dashboard';
        } else {
            err.textContent = data.message; err.classList.remove('d-none');
        }
    } catch(e) { err.textContent = '网络错误'; err.classList.remove('d-none'); }
};

// 已登录则跳转
if (localStorage.getItem('token')) window.location.href = API + '/admin/page/dashboard';
</script>
</body>
</html>
