<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: headContent(${pageTitle})}"></head>
<body>
<div th:replace="~{layout :: body(${role}, ${roleName}, ${pageTitle})}"></div>

<div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">用户管理</h4>
        <button class="btn btn-danger" onclick="openEdit()"><i class="bi bi-plus"></i> 新增用户</button>
    </div>

    <!-- 筛选条件 -->
    <div class="card stat-card mb-3">
        <div class="row g-3 align-items-end">
            <div class="col-auto">
                <label class="form-label small text-muted">角色</label>
                <select class="form-select form-select-sm" id="filter-role">
                    <option value="">全部</option>
                    <option value="1">C端消费者</option>
                    <option value="2">酒吧管理员</option>
                    <option value="5">平台运营超管</option>
                    <option value="6">酒商供应商</option>
                </select>
            </div>
            <div class="col-auto">
                <label class="form-label small text-muted">状态</label>
                <select class="form-select form-select-sm" id="filter-status">
                    <option value="">全部</option>
                    <option value="1">正常</option>
                    <option value="0">禁用</option>
                </select>
            </div>
            <div class="col-auto">
                <label class="form-label small text-muted">手机号/昵称</label>
                <input class="form-control form-control-sm" id="filter-keyword" placeholder="搜索手机号或昵称">
            </div>
            <div class="col-auto">
                <button class="btn btn-primary btn-sm" onclick="loadUsers()"><i class="bi bi-search"></i> 查询</button>
                <button class="btn btn-outline-secondary btn-sm" onclick="resetFilter()"><i class="bi bi-arrow-counterclockwise"></i> 重置</button>
            </div>
        </div>
    </div>

    <div class="card stat-card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead><tr>
                    <th>ID</th><th>手机号</th><th>昵称</th><th>角色</th>
                    <th>关联酒吧</th><th>关联酒商</th><th>年龄认证</th><th>状态</th><th>创建时间</th><th>操作</th>
                </tr></thead>
                <tbody id="user-tbody"><tr><td colspan="10" class="text-center text-muted">加载中...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<!-- 编辑弹窗 -->
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="modalTitle">新增用户</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
            <input type="hidden" id="f-id">
            <div class="mb-3">
                <label class="form-label">手机号 <span class="text-danger">*</span></label>
                <input class="form-control" id="f-phone" placeholder="+65xxxxxxxx">
            </div>
            <div class="mb-3">
                <label class="form-label">昵称</label>
                <input class="form-control" id="f-nickname">
            </div>
            <div class="row">
                <div class="col">
                    <label class="form-label">角色 <span class="text-danger">*</span></label>
                    <select class="form-select" id="f-role" onchange="toggleRoleFields()">
                        <option value="2">酒吧管理员</option>
                        <option value="5">平台运营超管</option>
                        <option value="6">酒商供应商</option>
                        <option value="1">C端消费者</option>
                    </select>
                </div>
                <div class="col">
                    <label class="form-label">状态</label>
                    <select class="form-select" id="f-status">
                        <option value="1">正常</option>
                        <option value="0">禁用</option>
                    </select>
                </div>
            </div>
            <div class="row mt-3" id="bar-field">
                <div class="col">
                    <label class="form-label">关联酒吧ID</label>
                    <input type="number" class="form-control" id="f-barId" placeholder="酒吧角色必填">
                </div>
            </div>
            <div class="row mt-3" id="supplier-field" style="display:none">
                <div class="col">
                    <label class="form-label">关联酒商ID</label>
                    <input type="number" class="form-control" id="f-supplierId" placeholder="酒商角色必填">
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
            <button class="btn btn-danger" onclick="saveUser()">保存</button>
        </div>
    </div></div>
</div>

<script th:replace="~{layout :: scripts}"></script>
<script>
const roleMap = {
    1:{text:'C端消费者',cls:'info'},
    2:{text:'酒吧管理员',cls:'primary'},
    5:{text:'平台运营超管',cls:'danger'},
    6:{text:'酒商供应商',cls:'success'}
};

async function loadUsers() {
    const role = document.getElementById('filter-role').value;
    const status = document.getElementById('filter-status').value;
    const keyword = document.getElementById('filter-keyword').value;
    let url = '/admin/users?';
    if (role) url += 'role=' + role + '&';
    if (status) url += 'status=' + status + '&';
    if (keyword) url += 'keyword=' + encodeURIComponent(keyword) + '&';
    const res = await apiGet(url);
    const list = res.data || [];
    document.getElementById('user-tbody').innerHTML = list.length ? list.map(u=>`
        <tr>
            <td>${u.id}</td>
            <td>${u.phone}</td>
            <td>${u.nickname||'-'}</td>
            <td>${statusTag(u.role, roleMap)}</td>
            <td>${u.barId||'-'}</td>
            <td>${u.supplierId||'-'}</td>
            <td>${u.ageVerified?'<span class="badge bg-success">已认证</span>':'<span class="badge bg-secondary">未认证</span>'}</td>
            <td>${statusTag(u.status, {1:{text:'正常',cls:'success'},0:{text:'禁用',cls:'danger'}})}</td>
            <td class="small text-muted">${u.createTime||''}</td>
            <td>
                <button class="btn btn-sm btn-outline-primary" onclick='openEdit(${JSON.stringify(u)})'>编辑</button>
                <button class="btn btn-sm btn-outline-${u.status===1?'warning':'success'}" onclick="toggleStatus(${u.id},${u.status===1?0:1})">${u.status===1?'禁用':'启用'}</button>
                <button class="btn btn-sm btn-outline-danger" onclick="delUser(${u.id})">删除</button>
            </td>
        </tr>`).join('') : '<tr><td colspan="10" class="text-center text-muted">暂无数据</td></tr>';
}

function resetFilter() {
    document.getElementById('filter-role').value = '';
    document.getElementById('filter-status').value = '';
    document.getElementById('filter-keyword').value = '';
    loadUsers();
}

function toggleRoleFields() {
    const role = parseInt(document.getElementById('f-role').value);
    document.getElementById('bar-field').style.display = (role === 2) ? '' : 'none';
    document.getElementById('supplier-field').style.display = (role === 6) ? '' : 'none';
}

function openEdit(u) {
    u = u || {};
    document.getElementById('modalTitle').textContent = u.id ? '编辑用户' : '新增用户';
    document.getElementById('f-id').value = u.id || '';
    document.getElementById('f-phone').value = u.phone || '';
    document.getElementById('f-phone').disabled = !!u.id;
    document.getElementById('f-nickname').value = u.nickname || '';
    document.getElementById('f-role').value = u.role || 2;
    document.getElementById('f-status').value = u.status ?? 1;
    document.getElementById('f-barId').value = u.barId || '';
    document.getElementById('f-supplierId').value = u.supplierId || '';
    toggleRoleFields();
    new bootstrap.Modal(document.getElementById('editModal')).show();
}

async function saveUser() {
    const id = document.getElementById('f-id').value;
    const role = parseInt(document.getElementById('f-role').value);
    const body = {
        phone: document.getElementById('f-phone').value,
        nickname: document.getElementById('f-nickname').value,
        role: role,
        status: parseInt(document.getElementById('f-status').value),
        barId: (role === 2) ? (document.getElementById('f-barId').value || null) : null,
        supplierId: role === 6 ? (document.getElementById('f-supplierId').value || null) : null
    };
    if (!body.phone) { alert('请输入手机号'); return; }
    const res = id ? await apiPut('/admin/users/'+id, body) : await apiPost('/admin/users', body);
    if (res.code === 200) { bootstrap.Modal.getInstance(document.getElementById('editModal')).hide(); loadUsers(); }
    else alert(res.message);
}

async function toggleStatus(id, status) {
    const res = await apiPut('/admin/users/'+id+'/status?status='+status);
    if (res.code === 200) loadUsers();
    else alert(res.message);
}

async function delUser(id) {
    if (!confirm('确定删除该用户？')) return;
    const res = await apiDelete('/admin/users/'+id);
    if (res.code === 200) loadUsers();
    else alert(res.message);
}

loadUsers();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
