<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: headContent(${pageTitle})}"></head>
<body>
<div th:replace="~{layout :: body(${role}, ${roleName}, ${pageTitle})}"></div>

<div class="main-content">
    <h4 class="mb-3 d-flex justify-content-between align-items-center">
        <span>履约三单核对日志</span>
        <button class="btn btn-outline-primary btn-sm" onclick="runReconcile()"><i class="bi bi-play-circle"></i> 立即跑批</button>
    </h4>
    <div class="alert alert-secondary small"><i class="bi bi-clock"></i> 每日凌晨 02:00 自动跑批：【主订单】↔【履约单】↔【通联授权状态】三向对齐</div>
    <div class="card stat-card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead><tr>
                    <th>核对日期</th><th>订单号</th><th>订单状态</th><th>履约状态</th>
                    <th>支付状态</th><th>核对结果</th><th>异常描述</th><th>处理状态</th>
                </tr></thead>
                <tbody id="tbody"><tr><td colspan="8" class="text-center text-muted">加载中...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<script th:replace="~{layout :: scripts}"></script>
<script>
const resultMap = {1:{text:'核对一致',cls:'success'},2:{text:'异常A-漏单',cls:'warning'},3:{text:'异常B-盗刷',cls:'danger'},4:{text:'异常C-损耗',cls:'info'},5:{text:'异常D-授权不一致',cls:'secondary'}};
const orderMap = {1:'待支付',2:'支付中',3:'已付款',4:'已完成',5:'已退款'};
const ticketMap = {1:'就绪待出',2:'出酒中',3:'已出酒',4:'出酒失败'};

async function load() {
    const res = await apiGet('/admin/reconcile');
    const list = res.data || [];
    document.getElementById('tbody').innerHTML = list.length ? list.map(r=>`
        <tr>
            <td>${r.reconcileDate||''}</td><td><code>${r.orderNo}</code></td>
            <td>${orderMap[r.orderStatus]||r.orderStatus}</td><td>${ticketMap[r.ticketStatus]||r.ticketStatus||'-'}</td>
            <td>${r.payStatus==1?'<span class="badge bg-success">成功</span>':'<span class="badge bg-secondary">未成功</span>'}</td>
            <td>${statusTag(r.reconcileResult, resultMap)}</td>
            <td><small>${r.anomalyDesc||''}</small></td>
            <td>${r.handled?'<span class="badge bg-success">已处理</span>':'<span class="badge bg-warning">待处理</span>'}</td>
        </tr>`).join('') : '<tr><td colspan="8" class="text-center text-muted">暂无核对记录</td></tr>';
}
load();

async function runReconcile() {
    if (!confirm('确认立即执行三向核对跑批？（核对今日订单）')) return;
    const today = new Date().toISOString().slice(0, 10);
    const res = await apiPost('/admin/reconcile/run?date=' + today, {});
    if (res.code === 200) { alert('跑批完成'); load(); }
    else alert(res.message || '跑批失败');
}
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
