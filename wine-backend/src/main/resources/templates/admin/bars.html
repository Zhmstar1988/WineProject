<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: headContent(${pageTitle})}"></head>
<body>
<div th:replace="~{layout :: body(${role}, ${roleName}, ${pageTitle})}"></div>

<div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">酒吧管理</h4>
        <button class="btn btn-danger" onclick="openEdit()"><i class="bi bi-plus"></i> 新增酒吧</button>
    </div>
    <div class="card stat-card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead><tr>
                    <th>酒吧编码</th><th>酒吧名称</th><th>地址</th><th>联系电话</th>
                    <th>通联子商户</th><th>进件状态</th><th>营业状态</th><th>操作</th>
                </tr></thead>
                <tbody id="bar-tbody"><tr><td colspan="8" class="text-center text-muted">加载中...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<!-- 编辑弹窗 -->
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="modalTitle">新增酒吧</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
            <input type="hidden" id="f-id">
            <div class="mb-3"><label class="form-label">酒吧编码</label><input class="form-control" id="f-barCode"></div>
            <div class="mb-3"><label class="form-label">酒吧名称</label><input class="form-control" id="f-barName"></div>
            <div class="mb-3"><label class="form-label">地址</label><input class="form-control" id="f-address"></div>
            <div class="mb-3"><label class="form-label">联系电话</label><input class="form-control" id="f-contactPhone"></div>
            <div class="mb-3"><label class="form-label">通联子商户号</label><input class="form-control" id="f-cusid"></div>
            <div class="row">
                <div class="col"><label class="form-label">进件状态</label>
                    <select class="form-select" id="f-merchantStatus">
                        <option value="0">未进件</option><option value="1">进件中</option><option value="2">已通过</option><option value="3">已驳回</option>
                    </select></div>
                <div class="col"><label class="form-label">营业状态</label>
                    <select class="form-select" id="f-status"><option value="1">营业中</option><option value="0">已停业</option></select></div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
            <button class="btn btn-danger" onclick="saveBar()">保存</button>
        </div>
    </div></div>
</div>

<script th:replace="~{layout :: scripts}"></script>
<script>
const merchantMap = {0:{text:'未进件',cls:'secondary'},1:{text:'进件中',cls:'warning'},2:{text:'已通过',cls:'success'},3:{text:'已驳回',cls:'danger'}};

async function loadBars() {
    const res = await apiGet('/admin/bars');
    const list = res.data || [];
    document.getElementById('bar-tbody').innerHTML = list.length ? list.map(b=>`
        <tr>
            <td>${b.barCode}</td><td>${b.barName}</td><td>${b.address||''}</td><td>${b.contactPhone||''}</td>
            <td><code>${b.cusid||'-'}</code></td>
            <td>${statusTag(b.merchantStatus, merchantMap)}</td>
            <td>${statusTag(b.status, {1:{text:'营业中',cls:'success'},0:{text:'已停业',cls:'secondary'}})}</td>
            <td>
                <button class="btn btn-sm btn-outline-primary" onclick='openEdit(${JSON.stringify(b)})'>编辑</button>
                <a class="btn btn-sm btn-outline-info" href="/api/admin/page/dispensers">设备</a>
            </td>
        </tr>`).join('') : '<tr><td colspan="8" class="text-center text-muted">暂无数据</td></tr>';
}

function openEdit(b) {
    b = b || {};
    document.getElementById('modalTitle').textContent = b.id ? '编辑酒吧' : '新增酒吧';
    document.getElementById('f-id').value = b.id || '';
    document.getElementById('f-barCode').value = b.barCode || '';
    document.getElementById('f-barName').value = b.barName || '';
    document.getElementById('f-address').value = b.address || '';
    document.getElementById('f-contactPhone').value = b.contactPhone || '';
    document.getElementById('f-cusid').value = b.cusid || '';
    document.getElementById('f-merchantStatus').value = b.merchantStatus ?? 0;
    document.getElementById('f-status').value = b.status ?? 1;
    new bootstrap.Modal(document.getElementById('editModal')).show();
}

async function saveBar() {
    const body = {
        id: document.getElementById('f-id').value || null,
        barCode: document.getElementById('f-barCode').value,
        barName: document.getElementById('f-barName').value,
        address: document.getElementById('f-address').value,
        contactPhone: document.getElementById('f-contactPhone').value,
        cusid: document.getElementById('f-cusid').value,
        merchantStatus: parseInt(document.getElementById('f-merchantStatus').value),
        status: parseInt(document.getElementById('f-status').value)
    };
    const res = body.id ? await apiPut('/admin/bars/'+body.id, body) : await apiPost('/admin/bars', body);
    if (res.code === 200) { bootstrap.Modal.getInstance(document.getElementById('editModal')).hide(); loadBars(); }
    else alert(res.message);
}
loadBars();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
